<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Deploy-time only: Netlify scans static HTML for forms at build.
      See https://docs.netlify.com/manage/forms/setup/#work-with-javascript-rendered-forms
    -->
    <form name="service-request" method="POST" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="service-request" />
      <p hidden>
        <label>Do not fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="service">
        <option value="General Pest Control">General Pest Control</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
